version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: flowconx
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowconx_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowconx -d flowconx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://flowconx:password@db:5432/flowconx_db
      - JWT_SECRET=supersecretjwtkeythatshouldbechangedinprod
      - PORT=3001
    depends_on:
      db:
        condition: service_healthy

  ml-api:
    build:
      context: ./newml
    ports:
      - "8010:8000"

  webui:
    build:
      context: ./webui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001

volumes:
  pgdata:
