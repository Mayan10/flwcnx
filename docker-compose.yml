version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: flowconx
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowconx_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowconx -d flowconx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://flowconx:password@db:5432/flowconx_db
      - JWT_SECRET=supersecretjwtkeythatshouldbechangedinprod
      - PORT=3001
    depends_on:
      db:
        condition: service_healthy

  ml-api:
    build:
      # The repository root: the research package lives there and the image is
      # built from it. .dockerignore keeps the consoles and the data out.
      context: .
    ports:
      - "8010:8000"

  webui:
    build:
      context: ./services/webui
      args:
        # Browser-side URLs, so these are host addresses rather than compose
        # service names. The /api suffix matters: the backend mounts its
        # routers there and the console appends paths like /auth/login.
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_ML_WS_URL: ws://localhost:8010/ws/ml/stream
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ml-api

volumes:
  pgdata:
