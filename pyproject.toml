[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flwcnx"
version = "0.1.0"
description = "Risk-controlled throughput forecasting and bandwidth allocation for Starlink access links."
requires-python = ">=3.11"
authors = [
  { name = "Mayan Sharma", email = "mayan25sharma@gmail.com" },
  { name = "Kriti Saini" },
  { name = "Devansh Behl" },
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["starlink", "leo", "conformal-prediction", "risk-control",
            "throughput-prediction", "admission-control"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: System :: Networking",
]
# Audited 2026-09-02 against actual imports. scipy, scikit-learn and pyyaml
# were declared and never imported: scipy in particular, because the one place
# it would have been used (the chi-squared tail in calibrate/heterogeneity.py)
# is hand rolled precisely so it is not a dependency.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xgboost>=2.0",
  # Never imported by this project, and required anyway: forecast/baselines.py
  # uses xgb.XGBRegressor, which is xgboost's scikit-learn API and raises
  # "sklearn needs to be installed" at runtime without it. Removing it on the
  # strength of a static import audit broke CI, which is what CI is for.
  "scikit-learn>=1.4",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# skyfield is kept because ingest/live.py is written against it for the live
# path, even though the replay path only needs sgp4.
orbital = ["sgp4>=2.23", "skyfield>=1.48"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Mayan10/flwcnx"

[tool.setuptools.packages.find]
include = ["flwcnx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
